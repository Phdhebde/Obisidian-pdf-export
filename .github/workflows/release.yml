name: Release

# Push a tag equal to the manifest version (e.g. `1.0.0`, no `v` prefix): the
# community plugin store downloads main.js, manifest.json and styles.css from
# the GitHub release with that exact name.
on:
  push:
    tags: ["*"]

permissions:
  contents: write
  # Signed build provenance for the release assets (`gh attestation verify`).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Microsoft's Open XML validator on sample Word exports: a schema error
      # here is a document Word would offer to "repair".
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate the Word export
        run: |
          node scripts/word-samples.ts word-samples
          dotnet run -c Release --project tools/ooxml-validate -- word-samples/*.docx

      - name: Check the tag matches the manifest
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css
