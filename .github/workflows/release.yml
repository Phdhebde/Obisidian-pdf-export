name: Release

# Push a tag equal to the manifest version (e.g. `1.0.0`, no `v` prefix): the
# community plugin store downloads main.js, manifest.json and styles.css from
# the GitHub release with that exact name.
on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft release
      # Signed build provenance for the release assets (`gh attestation verify`).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Microsoft's Open XML validator on sample Word exports: a schema error
      # here is a document Word would offer to "repair".
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Validate the Word export
        run: |
          node scripts/word-samples.ts word-samples
          dotnet run -c Release --project tools/ooxml-validate -- word-samples/*.docx

      - name: Check the tag matches the manifest
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # The signed Sigstore bundle, attached to the release so it can be checked
      # offline (`gh attestation verify main.js --bundle provenance.sigstore.json
      # --owner Phdhebde`); OpenSSF Scorecard also looks for it.
      - name: Keep the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" provenance.sigstore.json

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css provenance.sigstore.json
