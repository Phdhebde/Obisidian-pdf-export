name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Microsoft's Open XML validator on sample Word exports: a schema error
      # here is a document Word would offer to "repair".
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Validate the Word export
        run: |
          node scripts/word-samples.ts word-samples
          dotnet run -c Release --project tools/ooxml-validate -- word-samples/*.docx

  # Every sample Word export, the test bench templates included, opened and
  # printed by LibreOffice. A file it cannot open fails the job; the PDFs are
  # kept as an artifact to compare its rendering with Word's.
  libreoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
      - name: Open the Word export in LibreOffice
        run: |
          node scripts/word-samples.ts word-samples
          soffice --headless --convert-to pdf --outdir word-samples/pdf word-samples/*.docx
          for f in word-samples/*.docx; do
            pdf="word-samples/pdf/$(basename "${f%.docx}").pdf"
            if [ ! -s "$pdf" ]; then echo "LibreOffice could not open $f" >&2; exit 1; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libreoffice-pdf
          path: word-samples/pdf
