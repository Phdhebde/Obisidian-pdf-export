name: Documentation

# Builds the English and French sites with Zensical and publishes them on
# GitHub Pages: English at the root, French under /fr/. Repository setting
# needed once: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      # Pinned: Zensical is pre-1.0, and a new release may change the output.
      - run: pip install zensical==0.0.71

      # From the repository root, so the changelog and roadmap pages can
      # include CHANGELOG.md and ROADMAP.md.
      - name: Build
        run: |
          zensical build --clean --strict -f website/en/zensical.toml
          zensical build --clean --strict -f website/fr/zensical.toml
          mkdir -p _site/fr
          cp -r website/en/site/. _site/
          cp -r website/fr/site/. _site/fr/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment
