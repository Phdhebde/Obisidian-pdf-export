# Documentation site, French. See ../en/zensical.toml for how the two sites
# are built and assembled. Page paths match the English site one for one, so
# the hreflang links in ../overrides/main.html stay valid.

[project]
site_name = "PDF Report Exporter pour Obsidian"
site_url = "https://phdhebde.github.io/Obisidian-pdf-export/fr/"
site_description = "Plugin Obsidian gratuit qui exporte vos notes en rapports PDF professionnels : page de garde, sommaire cliquable, modèles, schémas Mermaid, callouts et versions client sans les passages confidentiels."
site_author = "Maxence H"
copyright = "Code sous licence MIT — PDF Report Exporter n’est pas affilié à Obsidian."
repo_url = "https://github.com/Phdhebde/Obisidian-pdf-export"
repo_name = "Phdhebde/Obisidian-pdf-export"
edit_uri = "edit/main/website/fr/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Accueil" = "index.md" },
  { "Premiers pas" = "getting-started.md" },
  { "Guide" = [
    "frontmatter.md",
    "markdown.md",
    "templates.md",
    "confidential-export.md",
  ] },
  { "FAQ" = "faq.md" },
  { "Projet" = [
    "changelog.md",
    "roadmap.md",
  ] },
  { "English" = "https://phdhebde.github.io/Obisidian-pdf-export/" },
]

[project.extra]
# Read by overrides/main.html for hreflang links and Open Graph tags.
lang = "fr"
locale = "fr_FR"
base_en = "https://phdhebde.github.io/Obisidian-pdf-export/"
base_fr = "https://phdhebde.github.io/Obisidian-pdf-export/fr/"
social_image = "https://phdhebde.github.io/Obisidian-pdf-export/assets/images/social-card.png"
version = "1.1.0"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Phdhebde/Obisidian-pdf-export"

[project.theme]
language = "fr"
custom_dir = "../overrides"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/file-text"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Passer en mode clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Suivre le réglage du système"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
