# Documentation site, English. The French one is ../fr/zensical.toml; both are
# built by .github/workflows/docs.yml and served by GitHub Pages:
#
#   zensical build -f website/en/zensical.toml   ->  _site/
#   zensical build -f website/fr/zensical.toml   ->  _site/fr/
#
# Run from the repository root: the changelog and roadmap pages include the
# root CHANGELOG.md and ROADMAP.md through pymdownx.snippets.

[project]
site_name = "PDF Report Exporter for Obsidian"
site_url = "https://phdhebde.github.io/Obisidian-pdf-export/"
site_description = "Free Obsidian plugin for custom, professional PDF export: cover page, clickable table of contents, branded templates and letterhead, Mermaid diagrams, callouts, and confidential client versions."
site_author = "Maxence H"
copyright = "Code under the MIT licence — PDF Report Exporter is not affiliated with Obsidian."
repo_url = "https://github.com/Phdhebde/Obisidian-pdf-export"
repo_name = "Phdhebde/Obisidian-pdf-export"
edit_uri = "edit/main/website/en/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    "frontmatter.md",
    "markdown.md",
    "templates.md",
    "confidential-export.md",
    "word-export.md",
  ] },
  { "Compare" = "compare.md" },
  { "FAQ" = "faq.md" },
  { "Project" = [
    "changelog.md",
    "roadmap.md",
  ] },
  { "Français" = "https://phdhebde.github.io/Obisidian-pdf-export/fr/" },
]

[project.extra]
# Read by overrides/main.html for hreflang links and Open Graph tags.
lang = "en"
locale = "en_US"
base_en = "https://phdhebde.github.io/Obisidian-pdf-export/"
base_fr = "https://phdhebde.github.io/Obisidian-pdf-export/fr/"
social_image = "https://phdhebde.github.io/Obisidian-pdf-export/assets/images/social-card.png"
version = "1.3.0"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Phdhebde/Obisidian-pdf-export"

[project.theme]
language = "en"
custom_dir = "../overrides"
logo = "assets/images/logo.svg"
favicon = "assets/images/favicon.svg"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
